name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: ruff + mypy + pytest (rápidas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"
      - name: ruff (lint)
        run: ruff check src tests scripts
      - name: ruff (formato)
        run: ruff format --check src tests scripts
      - name: mypy
        run: mypy
      - name: pytest -m "not slow"
        run: pytest -m "not slow" -q

  gui:
    name: GUI (PySide6 sin pantalla)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bibliotecas del sistema para Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev,gui]"
      - name: pytest tests/ui
        run: pytest tests/ui -q
